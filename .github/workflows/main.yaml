on: 
  push: 
    branches: [main]

name: Deploy API on push

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      # Récupère le code source du dépôt GitHub dans le runner
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader

      # Vérification de présence des secrets FTP
      - name: Verify FTP Secrets
        run: |
          echo "=== Vérification des secrets FTP Backend ==="
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "❌ Secret FTP_SERVER manquant ou vide !"; else echo "✅ FTP_SERVER présent"; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "❌ Secret FTP_USERNAME manquant ou vide !"; else echo "✅ FTP_USERNAME présent"; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "❌ Secret FTP_PASSWORD manquant ou vide !"; else echo "✅ FTP_PASSWORD présent"; fi

      # Envoie les fichiers du dossier backend/ vers le serveur via FTP
      # Les fichiers sensibles (.env, .git) sont exclus
      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/tests/**
            **/storage/logs/**